# The default policy. Copy it beside your Dockerfile and change it there; pass it with --policy.
# Every accepted finding needs a reason and a date. The date is when the acceptance expires and
# the finding blocks again, so nothing is accepted forever by accident.
version: 1

block:
  # Findings at these severities block the image.
  severity: [HIGH, CRITICAL]
  # A finding with no fix available is reported, not blocked: there is nothing to do about it yet.
  ignore_unfixed: true

licences:
  # Trivy sorts every licence into a category: forbidden, restricted, reciprocal, notice,
  # permissive, unencumbered, unknown. Only the categories listed here block; the rest are
  # reported in licences.txt for a person to read.
  forbid: [forbidden]

# Findings judged not to apply, with the reason written down. "Not affected, and why."
accepted: []
#  - id: CVE-2026-111943
#    reason: helper binary runs once at container start and opens no socket
#    until: 2026-12-31

databases:
  # The gate's own databases must be no older than this many days, or the run is BROKEN: a scan
  # with a stale database is a scan that finds nothing. The image is rebuilt every Monday, so 7
  # fits the floating tags. Raise it for a pinned dated tag; 0 turns the check off.
  max_age_days: 7

boot:
  # The Spring Boot checks run when the image holds a Boot application and say so when it does
  # not. Which of their findings block: actuator (endpoints beyond health and info exposed with no
  # Spring Security), dev-profile (a development profile active). unlayered (one fat jar) is
  # reported unless listed here. Accept a finding by its id, BOOT-ACTUATOR, BOOT-DEV-PROFILE,
  # BOOT-UNLAYERED, under accepted with a reason and a date, like a CVE.
  block: [actuator, dev-profile]
  # Profile names that mean "not production" when active.
  dev_profiles: [dev, development, local, test, debug]
