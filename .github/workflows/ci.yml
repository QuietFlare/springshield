# Build the gate and prove it judges correctly: SHIP on a clean image, BLOCK on an old one with
# fixable findings, BROKEN on an image that does not exist. Then publish:
#
#   push to main      :main                          the development build
#   tag v1.0.0        :1.0.0-20261022 :1.0.0 :1.0 :1  a release; the dated tag never moves
#   Monday schedule   the newest release rebuilt with fresh databases: a new dated tag, and the
#                     floating tags move to it; the code is unchanged
#
# A gate's verdict depends on the databases of the day, so a release is addressable by day.

name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/quietflare/springshield
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Which version this build is
        # A tag names it. The weekly rebuild takes the newest tag. Everything else is a dev build.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            tag=$(git tag --list 'v*' --sort=-version:refname | head -1)
            [ -n "$tag" ] || { echo "no release tag to rebuild"; exit 1; }
            git checkout -q "$tag"
            version="${tag#v}"
          else
            version="dev"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "DATE=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
          echo "building $version"

      - name: Build the gate
        run: docker build --build-arg VERSION="${VERSION}-${DATE}" -t springshield:test .

      - name: Expect SHIP on a current minimal image
        run: |
          mkdir -p reports/ship
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/reports/ship:/reports" springshield:test alpine:3.21
          jq . reports/ship/verdict.json

      - name: Expect BLOCK on an old image with fixable findings
        run: |
          mkdir -p reports/block
          set +e
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/reports/block:/reports" springshield:test nginx:1.18
          code=$?
          set -e
          [ "$code" -eq 1 ] || { echo "expected exit 1 (BLOCK), got $code"; exit 1; }
          [ "$(jq -r .verdict reports/block/verdict.json)" = "BLOCKED" ]

      - name: Expect BROKEN on an image that does not exist
        run: |
          mkdir -p reports/broken
          set +e
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/reports/broken:/reports" springshield:test ghcr.io/quietflare/does-not-exist:0
          code=$?
          set -e
          [ "$code" -eq 2 ] || { echo "expected exit 2 (BROKEN), got $code"; exit 1; }

      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_id }}
          path: reports/

      - name: Registry login
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the development build
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag springshield:test "$IMAGE:main"
          docker push "$IMAGE:main"

      - name: Publish the release, dated and floating tags
        if: env.VERSION != 'dev'
        run: |
          major="${VERSION%%.*}"; minor="${VERSION%.*}"
          for t in "$VERSION-$DATE" "$VERSION" "$minor" "$major"; do
            docker tag springshield:test "$IMAGE:$t"
            docker push "$IMAGE:$t"
          done
          echo "published $IMAGE:$VERSION-$DATE and moved :$VERSION :$minor :$major"

      - name: GitHub release, once per tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$VERSION" | cut -d@ -f2)
          notes=$(awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md)
          gh release create "v$VERSION" --title "springshield $VERSION" --notes "$notes

          Image: \`$IMAGE:$VERSION-$DATE\`
          Digest: \`$digest\`"
