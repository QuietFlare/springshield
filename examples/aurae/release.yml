# Aurae's image job with springshield in place of six hand-written scan steps.
# Build, gate, push. The gate's reports stay with the run; the push happens only on SHIP.

  image:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: cd web && npm ci
      - uses: gradle/actions/setup-gradle@v4

      - name: Version from the tag
        run: |
          echo "IMAGE_TAG=${VERSION#v}" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/quietflare/aurae:${VERSION#v}" >> "$GITHUB_ENV"

      - name: Build
        working-directory: api
        run: |
          ./gradlew bootJar -Pversion=${IMAGE_TAG}
          docker build --build-arg JAR_FILE=build/libs/aurae-api-${IMAGE_TAG}.jar -t "$IMAGE" .
          docker save "$IMAGE" -o /tmp/image.tar

      - name: Gate
        # The image is handed over as a tar, so the gate needs no registry access and no Docker socket.
        run: |
          mkdir -p reports
          docker run --rm \
            -v /tmp/image.tar:/image.tar:ro \
            -v "$PWD/api/Dockerfile:/Dockerfile:ro" \
            -v "$PWD/api/gate.yaml:/gate.yaml:ro" \
            -v "$PWD/reports:/reports" \
            ghcr.io/quietflare/springshield:1 /image.tar --dockerfile /Dockerfile --policy /gate.yaml

      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: "springshield-${{ env.IMAGE_TAG }}", path: reports/ }

      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }

      - name: Push, only after SHIP
        run: docker push "$IMAGE"
